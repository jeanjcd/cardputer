[env:cardputer]
platform = espressif32@8.0.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*>
lib_deps =
  m5stack/M5Cardputer@1.1.1
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
  jgromes/RadioLib@7.8.1
test_build_src = yes

[env:native]
platform = native
build_src_filter = +<mesh/>
test_build_src = yes
build_flags = -std=gnu++17

; Native tests under AddressSanitizer + UndefinedBehaviorSanitizer.
; Runs on Linux/macOS GCC or Clang (the CI uses ubuntu-latest). MinGW/WinLibs
; on Windows has no ASan runtime, so this env does not link there.
; M5MH_FUZZ_ITERS (environment) scales test_fuzz iterations down if needed.
[env:native_sanitize]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -fsanitize=address,undefined
  -fno-sanitize-recover=all
  -fno-omit-frame-pointer
  -g
extra_scripts = post:tools/sanitize_link.py
