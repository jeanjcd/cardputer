[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*>
lib_deps =
  m5stack/M5Cardputer
  jgromes/RadioLib@^7
  rweather/Crypto@^0.4.0
test_build_src = yes

[env:native]
platform = native
lib_deps = rweather/Crypto
build_src_filter = +<mesh/>
test_build_src = yes
build_flags = -std=gnu++17
