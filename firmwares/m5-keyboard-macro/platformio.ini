[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
test_port = COM7
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Cardputer
  h2zero/NimBLE-Arduino@^2.3.0
test_build_src = yes
