name: codeql-m5-mesh-hello

on:
  push:
    paths:
      - "firmwares/m5-mesh-hello/**"
      - ".github/workflows/codeql-m5-mesh-hello.yml"
  pull_request:
    paths:
      - "firmwares/m5-mesh-hello/**"
      - ".github/workflows/codeql-m5-mesh-hello.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: firmwares/m5-mesh-hello
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.2.0"
      - name: Install native toolchain (outside the traced build)
        run: pio pkg install -e native
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build native test programs
        run: pio test -e native --without-testing
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:c-cpp/m5-mesh-hello"
