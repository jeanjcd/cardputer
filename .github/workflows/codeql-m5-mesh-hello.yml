name: codeql-m5-mesh-hello

on:
  push:
    paths:
      - "firmwares/m5-mesh-hello/**"
      - ".github/workflows/codeql-m5-mesh-hello.yml"
  pull_request:
    paths:
      - "firmwares/m5-mesh-hello/**"
      - ".github/workflows/codeql-m5-mesh-hello.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repo is public: results are uploaded to the Security tab (code
    # scanning), also kept as a SARIF artifact, and the job fails on any finding.
    permissions:
      contents: read
      actions: read
      security-events: write
    defaults:
      run:
        working-directory: firmwares/m5-mesh-hello
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.2.0"
      - name: Install native toolchain (outside the traced build)
        run: pio pkg install -e native
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build native test programs
        run: pio test -e native --without-testing
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:c-cpp/m5-mesh-hello"
          upload: always
          output: codeql-results
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-results-m5-mesh-hello
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail on CodeQL results
        working-directory: ${{ github.workspace }}
        shell: python
        run: |
          import glob, json, sys
          files = glob.glob("codeql-results/*.sarif")
          if not files:
              sys.exit("no SARIF output found")
          total = 0
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  sarif = json.load(fh)
              for run in sarif.get("runs", []):
                  for r in run.get("results", []):
                      total += 1
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", "?")
                      msg = r.get("message", {}).get("text", "")
                      print(f"::error file={path},line={line}::{r.get('ruleId')}: {msg}")
          print(f"{total} CodeQL result(s) in {len(files)} SARIF file(s)")
          sys.exit(1 if total else 0)
